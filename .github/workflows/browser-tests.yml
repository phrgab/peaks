name: GUI tests

# The inline display panels in real JupyterLab and marimo sessions (headless Chromium),
# plus the headless GUI tests. Runs only when GUI code changes, or manually.
on:
  pull_request:
    paths:
      - "peaks/core/GUI/**"
      - "tests/core/GUI/**"
      - "tests/browser/**"
      - ".github/workflows/browser-tests.yml"
  push:
    branches:
      - "**"
    paths:
      - "peaks/core/GUI/**"
      - "tests/core/GUI/**"
      - "tests/browser/**"
      - ".github/workflows/browser-tests.yml"
  workflow_dispatch: # can be triggered manually from the GH UI

jobs:
  gui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install peaks with browser test dependencies
        run: pip install -e ".[browser-tests]"
      - name: Install Chromium and the libraries Qt needs
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb x11-utils libegl1 libgl1 libdbus-1-3 \
            libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Run headless GUI tests
        run: xvfb-run -a pytest tests/core/GUI
      - name: Run browser tests
        run: xvfb-run -a pytest -m browser tests/browser
      - name: Upload screenshots and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-logs
          path: /tmp/pytest-of-runner/
          retention-days: 7
